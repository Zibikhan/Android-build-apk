name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: |
          unzip -q AndroidStreamControl.zip
          cd AndroidStreamControl
          echo "org.gradle.jvmargs=-Xmx3g" > gradle.properties
          gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" AndroidStreamControl/app/build/outputs/apk/debug/app-debug.apk --title "Build ${{ github.run_number }}" --notes "Debug build"
